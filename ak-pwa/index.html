<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10171c" />
    <title>Anna Karenina — Reading Companion</title>
    <style>
      html, body { 
        margin: 0; 
        padding: 0;
        width: 100%;
        min-height: 100%; 
        background: #10171c; 
        overflow-x: hidden; /* Absolute stop for horizontal panning */
      }
      
      /* Ensure padding doesn't mathematically add to an element's width */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      /* Force the timeline and character map to dynamically shrink */
      svg, img, canvas {
        max-width: 100%;
        height: auto;
      }

      /* Prevent any hardcoded desktop containers from pushing past the screen */
      #root * {
        max-width: 100vw;
      }

      /* Ensure long Russian names don't force text to clip off-screen */
      p, span, blockquote, li, div {
        overflow-wrap: break-word;
        word-wrap: break-word;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
