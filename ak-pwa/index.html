<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10171c" />
    <title>Anna Karenina — Reading Companion</title>
    <style>
      html, body, #root { 
        margin: 0; 
        padding: 0;
        width: 100%;
        min-height: 100%; 
        background: #10171c; 
      }
      
      /* Ensure padding doesn't accidentally add to element width calculations */
      * {
        box-sizing: border-box;
      }

      /* Force all text blocks to wrap sentences onto new lines naturally */
      p, span, blockquote, h1, h2, h3, footer, li {
        overflow-wrap: break-word;
        word-wrap: break-word;
        white-space: normal !important;
      }

      /* Mobile Layout Override */
      @media (max-width: 680px) {
        #root div, #root main, #root section {
          width: 100% !important;
          max-width: 100% !important;
          min-width: 0 !important;
          margin-left: 0 !important;
          margin-right: 0 !important;
          padding-left: 16px !important;
          padding-right: 16px !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
